<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020b0e">
<title>Personal Study AI</title>

<style>
:root {
  --cyan: #79faff;
  --blue: #25b9ff;
  --bg: #02090d;
  --dim: #52777d;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: #d9ffff;
  background:
    radial-gradient(ellipse at 50% 40%, #07313a 0%, transparent 43%),
    linear-gradient(145deg, #020608, #04151b 55%, #010507);
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .15;
  background: repeating-linear-gradient(
    0deg, transparent 0px, transparent 4px,
    #49eaff 5px, transparent 6px
  );
}

header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 20px;
  border-bottom: 1px solid #17434b;
  letter-spacing: 3px;
  font-size: 11px;
}

.brand { color: var(--cyan); font-weight: 800; }
.status { color: #83aeb4; font-size: 9px; letter-spacing: 2px; }

main {
  width: min(100%, 650px);
  margin: auto;
  padding: 15px 18px 35px;
}

.namebox { text-align: center; margin-top: 12px; }

.namebox label {
  display: block;
  color: #71969d;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

#aiName {
  width: 180px;
  color: var(--cyan);
  background: transparent;
  border: 0;
  border-bottom: 1px solid #28646c;
  text-align: center;
  font-size: 17px;
  letter-spacing: 5px;
  padding: 7px;
  outline: none;
}

.core {
  width: min(77vw, 330px);
  aspect-ratio: 1;
  margin: 14px auto 5px;
  position: relative;
  display: grid;
  place-items: center;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid #36e7f6;
  box-shadow: 0 0 15px #1bd9ed33, inset 0 0 15px #1bd9ed15;
}

.r1 { inset: 2%; border-width: 2px; border-right-color: transparent; animation: spin 12s linear infinite; }
.r2 { inset: 9%; border-style: dashed; opacity: .7; animation: spin 22s linear infinite reverse; }
.r3 { inset: 17%; border-width: 5px; border-color: #1d91ac #7bfaff #164b62 #39dff1; animation: spin 18s linear infinite; }
.r4 { inset: 25%; border-style: dotted; opacity: .8; animation: spin 30s linear infinite reverse; }
.r5 { inset: 32%; border-color: #6afaff88; }

.center {
  z-index: 1;
  text-align: center;
  text-shadow: 0 0 18px #67faff99;
}

#centerName {
  font-size: clamp(25px, 7vw, 38px);
  letter-spacing: 7px;
  font-weight: 300;
  overflow-wrap: anywhere;
}

.subtitle {
  margin-top: 10px;
  color: #78a8ae;
  font-size: 9px;
  letter-spacing: 4px;
}

.core::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 16px 5px #38eaff;
}

@keyframes spin { to { transform: rotate(360deg); } }

.info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin: 8px 0 15px;
}

.panel {
  border-left: 1px solid #28616a;
  padding: 4px 0 4px 12px;
  min-width: 0;
}

.label {
  color: #668c92;
  font-size: 9px;
  letter-spacing: 2px;
  margin-bottom: 9px;
}

.value {
  color: #b7e7e9;
  font-size: 12px;
  letter-spacing: 1px;
  overflow-wrap: anywhere;
}

#mic {
  display: block;
  width: 70px;
  height: 70px;
  margin: 15px auto 8px;
  border-radius: 50%;
  color: var(--cyan);
  font-size: 28px;
  background: #07191e;
  border: 1px solid #69faff;
  box-shadow: 0 0 0 7px #3beeff0b, 0 0 25px #20d8ed22;
}

#mic.listening {
  background: #0b3941;
  box-shadow: 0 0 25px #29eaff77;
  animation: pulse 1s ease-in-out infinite alternate;
}

@keyframes pulse {
  to { box-shadow: 0 0 40px #29eaffaa; }
}

.hint {
  text-align: center;
  color: #709ba2;
  font-size: 9px;
  letter-spacing: 2px;
}

.chat {
  margin-top: 23px;
  border: 1px solid #17444c;
  background: #031116bb;
  padding: 14px;
  border-radius: 5px;
}

.chatTitle {
  font-size: 10px;
  color: var(--cyan);
  letter-spacing: 3px;
  margin-bottom: 12px;
}

#conversation {
  min-height: 90px;
  max-height: 220px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.8;
  color: #c5e5e8;
  white-space: pre-wrap;
}

.entry { display: flex; gap: 8px; margin-top: 12px; }

#question {
  min-width: 0;
  flex: 1;
  background: #061b20;
  border: 1px solid #22545c;
  border-radius: 4px;
  color: white;
  padding: 12px;
  font-size: 14px;
}

button { cursor: pointer; }

#send, #stop {
  border: 1px solid #3cbfc9;
  background: #08282e;
  color: var(--cyan);
  border-radius: 4px;
  padding: 0 13px;
}

.tools {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.tools button {
  flex: 1;
  padding: 10px 5px;
  color: #8ecbd0;
  background: #06151a;
  border: 1px solid #19434b;
  border-radius: 4px;
  font-size: 11px;
}

footer {
  margin-top: 25px;
  text-align: center;
  color: #42656b;
  font-size: 9px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<header>
  <div class="brand">◉ PERSONAL AI / STUDY</div>
  <div class="status" id="status">SYSTEM READY</div>
</header>

<main>
  <div class="namebox">
    <label for="aiName">YOUR AI NAME · TAP TO EDIT</label>
    <input id="aiName" value="HAYATO" maxlength="18" aria-label="AIの名前">
  </div>

  <div class="core" id="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="ring r5"></div>
    <div class="center">
      <div id="centerName">HAYATO</div>
      <div class="subtitle">STUDY INTELLIGENCE</div>
    </div>
  </div>

  <div class="info">
    <div class="panel">
      <div class="label">VOICE INPUT</div>
      <div class="value" id="voiceStatus">STANDBY</div>
    </div>
    <div class="panel">
      <div class="label">VOICE OUTPUT</div>
      <div class="value" id="outputStatus">READY</div>
    </div>
    <div class="panel">
      <div class="label">STUDY MODE</div>
      <div class="value">LEARNING SUPPORT</div>
    </div>
    <div class="panel">
      <div class="label">CONNECTION</div>
      <div class="value">LOCAL / NO API KEY</div>
    </div>
  </div>

  <button id="mic" aria-label="音声入力">🎙</button>
  <div class="hint" id="micHint">TAP TO SPEAK</div>

  <section class="chat">
    <div class="chatTitle">▸ STUDY COMMUNICATION</div>
    <div id="conversation" aria-live="polite">AIを起動しました。
勉強の質問を入力するか、マイクをタップして話しかけてね。</div>
    <div class="entry">
      <input id="question" placeholder="質問を入力…（例：分数を教えて）" autocomplete="off">
      <button id="send">送信</button>
    </div>
    <div class="tools">
      <button id="speakAgain">🔊 もう一度読む</button>
      <button id="stop">音声停止</button>
      <button id="clear">履歴クリア</button>
    </div>
  </section>

  <footer>PERSONAL STUDY SYSTEM · BROWSER MODE</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let lastReply = "";
let recognition = null;
let listening = false;

function getName() {
  return $("aiName").value.trim() || "MY AI";
}

function updateName() {
  $("centerName").textContent = getName();
  document.title = getName() + " | Study AI";
  try { localStorage.setItem("studyAIName", getName()); } catch(e) {}
}

try {
  const saved = localStorage.getItem("studyAIName");
  if (saved) $("aiName").value = saved;
} catch(e) {}
updateName();
$("aiName").addEventListener("input", updateName);

function addMessage(who, text) {
  const box = $("conversation");
  box.textContent += "\n\n" + who + "： " + text;
  box.scrollTop = box.scrollHeight;
}

function answerQuestion(raw) {
  const q = raw.trim().toLowerCase();
  if (!q) return;

  addMessage("YOU", raw);
  let reply = "";

  if (/こんにちは|おはよう|こんばんは|やあ/.test(q)) {
    reply = "こんにちは！今日は何を勉強しようか？わからないところを一つずつ整理していこう。";
  } else if (/名前|君の名前/.test(q)) {
    reply = "私の名前は" + getName() + "だよ。上の名前欄から自由に変更できるよ。";
  } else if (/数学|算数|計算|分数|方程式|数学/.test(q)) {
    reply = "数学の問題だね。まず、問題文とわかっている条件を整理しよう。式を一つずつ確認して、答えだけでなく解き方も理解していこう。具体的な問題を入力してくれると、より詳しく手伝えるよ。";
  } else if (/英語|英文|英単語|文法|訳して/.test(q)) {
    reply = "英語の勉強だね。英文や単語を入力してみて。意味、文法、覚え方を順番に整理しよう。";
  } else if (/理科|化学|物理|生物|地学/.test(q)) {
    reply = "理科の勉強だね。まず、何が起きているかを整理して、原因と結果をつなげて考えよう。わからない用語や問題を送ってね。";
  } else if (/歴史|社会|地理|公民/.test(q)) {
    reply = "社会の勉強だね。出来事の背景、重要な用語、結果をセットで覚えると理解しやすいよ。調べたいテーマを教えてね。";
  } else if (/勉強|集中|やる気|計画|宿題/.test(q)) {
    reply = "まずは小さな目標を一つ決めよう。例えば10分だけ問題を解き、そのあと理解できたことを一つ振り返る。今、勉強したい科目は何かな？";
  } else if (/ヒント|わからない|分からない|教えて/.test(q)) {
    reply = "もちろん！問題文をそのまま入力してね。いきなり答えを出すのではなく、まずヒントから一緒に考えていこう。";
  } else {
    reply = "質問を受け取ったよ！今の無料試作版は、まだ本物の生成AIには接続されていないんだ。勉強の科目や問題文を具体的に入力してみてね。今後、無料で使えるAI接続方法があるか確認しながら機能を増やそう。";
  }

  lastReply = reply;
  addMessage(getName(), reply);
  speak(reply);
}

function speak(text) {
  if (!("speechSynthesis" in window)) {
    $("outputStatus").textContent = "NOT SUPPORTED";
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ja-JP";
  utterance.rate = 0.95;
  utterance.pitch = 1.0;
  utterance.onstart = () => $("outputStatus").textContent = "SPEAKING";
  utterance.onend = () => $("outputStatus").textContent = "READY";
  utterance.onerror = () => $("outputStatus").textContent = "VOICE ERROR";
  window.speechSynthesis.speak(utterance);
}

$("send").addEventListener("click", () => {
  const text = $("question").value;
  $("question").value = "";
  answerQuestion(text);
});

$("question").addEventListener("keydown", e => {
  if (e.key === "Enter") $("send").click();
});

$("speakAgain").addEventListener("click", () => {
  if (lastReply) speak(lastReply);
  else speak("こんにちは。勉強を始めよう。");
});

$("stop").addEventListener("click", () => {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  if (recognition && listening) recognition.stop();
  $("outputStatus").textContent = "STOPPED";
});

$("clear").addEventListener("click", () => {
  $("conversation").textContent = "履歴をクリアしました。何を勉強しようか？";
  lastReply = "";
});

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    $("mic").classList.add("listening");
    $("voiceStatus").textContent = "LISTENING";
    $("micHint").textContent = "LISTENING… SPEAK NOW";
    $("status").textContent = "VOICE ACTIVE";
  };

  recognition.onresult = event => {
    const text = event.results[0][0].transcript;
    $("question").value = text;
    answerQuestion(text);
  };

  recognition.onerror = event => {
    $("voiceStatus").textContent = "ERROR";
    $("micHint").textContent =
      event.error === "not-allowed"
        ? "ALLOW MICROPHONE IN SAFARI SETTINGS"
        : "VOICE INPUT FAILED · TRY TEXT";
  };

  recognition.onend = () => {
    listening = false;
    $("mic").classList.remove("listening");
    $("voiceStatus").textContent = "STANDBY";
    $("status").textContent = "SYSTEM READY";
    if ($("micHint").textContent.startsWith("LISTENING")) {
      $("micHint").textContent = "TAP TO SPEAK";
    }
  };

  $("mic").addEventListener("click", () => {
    if (listening) recognition.stop();
    else {
      try { recognition.start(); }
      catch(e) { $("micHint").textContent = "WAIT A MOMENT AND TRY AGAIN"; }
    }
  });
} else {
  $("mic").addEventListener("click", () => {
    $("micHint").textContent = "VOICE INPUT NOT AVAILABLE · USE TEXT";
    $("voiceStatus").textContent = "NOT SUPPORTED";
    addMessage("SYSTEM", "このSafariでは音声入力機能が使えない可能性があります。下の入力欄を使ってね。");
  });
  $("voiceStatus").textContent = "NOT SUPPORTED";
}
</script>
</body>
</html>
